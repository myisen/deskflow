# logrotate configuration for clipshare.
#
# Install to /etc/logrotate.d/clipshare (install_linux_service.sh does this
# automatically, substituting __LOG_USER__ / __LOG_GROUP__ with the service
# user). It rotates the active log /var/log/clipshare/clipshare.log once a
# day, keeps one month (30 daily rotations), compresses old ones and deletes
# anything older than 30 days - i.e. it follows the system log cleanup
# mechanism like other services under /var/log.
#
# Requirements:
#   - the log directory /var/log/clipshare must exist and be writable by the
#     user running clipshare (the install script creates and chowns it)
#   - the active file is created with the ownership below so the service user
#     can keep appending after each rotation
#
# Manual setup example (as root):
#   mkdir -p /var/log/clipshare && chown <user>:<group> /var/log/clipshare
#   sed -e 's/__LOG_USER__/<user>/' -e 's/__LOG_GROUP__/<group>/' \
#       logrotate-clipshare.conf > /etc/logrotate.d/clipshare
/var/log/clipshare/clipshare.log {
    daily
    rotate 30
    maxage 30
    missingok
    notifempty
    compress
    dateext
    dateformat -%Y%m%d
    create 0644 __LOG_USER__ __LOG_GROUP__
    nomail
}
